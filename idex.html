<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mathematics Clock</title>
    <style>
      :root {
        --bg-1: #07111c;
        --bg-2: #101d31;
        --bg-3: #1a2944;
        --panel: rgba(10, 15, 30, 0.7);
        --glass: rgba(255, 255, 255, 0.08);
        --text: #eef4ff;
        --muted: #bfd0ee;
        --hour: #dfeeff;
        --minute: #9fd0ff;
        --second: #ff7fb8;
        --ring: rgba(255, 255, 255, 0.12);
        --blue: #7ecbff;
        --lavender: #a987ff;
        --mint: #71f2c9;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(126, 203, 255, 0.28), transparent 26%),
          radial-gradient(circle at bottom right, rgba(169, 135, 255, 0.25), transparent 28%),
          linear-gradient(135deg, var(--bg-1), var(--bg-2) 48%, var(--bg-3));
        color: var(--text);
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        border-radius: 50%;
        filter: blur(48px);
        pointer-events: none;
      }

      body::before {
        width: 520px;
        height: 520px;
        left: -120px;
        top: -120px;
        background: rgba(126, 203, 255, 0.18);
      }

      body::after {
        width: 620px;
        height: 620px;
        right: -180px;
        bottom: -180px;
        background: rgba(169, 135, 255, 0.18);
      }

      .panel {
        position: relative;
        width: min(92vw, 560px);
        padding: 1.8rem 1.2rem 1.4rem;
        border-radius: 28px;
        background: rgba(7, 12, 25, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow:
          0 36px 80px rgba(0, 0, 0, 0.42),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(10px);
      }

      .panel::before {
        content: "";
        position: absolute;
        inset: 12px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        pointer-events: none;
      }

      .clock-box {
        display: grid;
        place-items: center;
        gap: 0.8rem;
      }

      .clock {
        position: relative;
        width: min(76vw, 390px);
        aspect-ratio: 1;
        border-radius: 50%;
        background:
          radial-gradient(circle at 50% 35%, rgba(255,255,255,0.20), rgba(255,255,255,0.04) 18%, rgba(14,19,31,0.88) 52%, rgba(5,9,17,0.98) 100%);
        border: 2px solid rgba(255, 255, 255, 0.13);
        box-shadow:
          inset 0 0 0 14px rgba(255,255,255,0.03),
          inset 0 0 25px rgba(126, 203, 255, 0.18),
          0 25px 50px rgba(0, 0, 0, 0.4);
      }

      .clock::before {
        content: "";
        position: absolute;
        inset: 18px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.08);
      }

      .dial {
        position: absolute;
        inset: 0;
      }

      .tick {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 4px;
        height: 18px;
        background: rgba(255,255,255,0.34);
        margin-left: -2px;
        margin-top: -170px;
        border-radius: 99px;
        transform-origin: center 170px;
      }

      .tick.major {
        width: 5px;
        height: 22px;
        background: linear-gradient(to bottom, rgba(126,203,255,0.95), rgba(255,255,255,0.8));
        box-shadow: 0 0 10px rgba(126,203,255,0.45);
      }

      .label {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 80px;
        text-align: center;
        margin-left: -40px;
        margin-top: -118px;
        font-weight: 700;
        font-size: 0.68rem;
        line-height: 1.1;
        color: rgba(238,244,255,0.92);
        transform-origin: center 118px;
        text-shadow: 0 0 10px rgba(126,203,255,0.4);
      }

      .label span {
        display: inline-block;
        transform: rotate(0deg);
      }

      .label small {
        display: block;
        margin-top: 1px;
        font-size: 0.5rem;
        letter-spacing: 0.08em;
        color: rgba(191,208,238,0.9);
      }

      .hand {
        position: absolute;
        left: 50%;
        bottom: 50%;
        transform-origin: center bottom;
        border-radius: 999px;
        box-shadow: 0 0 10px rgba(0,0,0,0.18);
      }

      .hand.hour {
        width: 8px;
        height: 96px;
        margin-left: -4px;
        background: linear-gradient(to top, var(--hour), #f8fbff);
      }

      .hand.minute {
        width: 6px;
        height: 130px;
        margin-left: -3px;
        background: linear-gradient(to top, var(--minute), #e8f3ff);
      }

      .hand.second {
        width: 3px;
        height: 152px;
        margin-left: -1.5px;
        background: linear-gradient(to top, var(--second), #ffc3dd);
      }

      .center {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 22px;
        height: 22px;
        margin-left: -11px;
        margin-top: -11px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #ffffff, #d1ebff 30%, #7ecbff 52%, #18304e 100%);
        box-shadow: 0 0 20px rgba(126,203,255,0.75);
        z-index: 10;
      }

      .time {
        text-align: center;
        letter-spacing: 0.16em;
        font-size: clamp(0.9rem, 2vw, 1.25rem);
        color: var(--muted);
      }

      .time strong {
        font-size: clamp(1.15rem, 2.6vw, 1.7rem);
        color: var(--text);
      }

      @media (max-width: 480px) {
        .panel {
          padding: 1.5rem 0.6rem 1.1rem;
          border-radius: 22px;
        }

        .clock {
          width: min(84vw, 300px);
        }

        .label {
          width: 78px;
          margin-left: -39px;
          font-size: 0.7rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="clock-box">
        <div class="clock" aria-label="Mathematics clock" role="img">
          <div class="dial" id="dial"></div>
          <div class="hand hour" id="hourHand"></div>
          <div class="hand minute" id="minuteHand"></div>
          <div class="hand second" id="secondHand"></div>
          <div class="center"></div>
        </div>
        <div class="time"><strong id="timeText">00:00:00</strong></div>
      </div>
    </div>

    <script>
      const dial = document.getElementById('dial');
      const hourHand = document.getElementById('hourHand');
      const minuteHand = document.getElementById('minuteHand');
      const secondHand = document.getElementById('secondHand');
      const timeText = document.getElementById('timeText');

      const formulaLabels = [
        { main: '√(3² − 8)', sub: '1' },
        { main: 'log₂(16) − 2', sub: '2' },
        { main: '√(5² − 16)', sub: '3' },
        { main: 'log₂(64) − 2', sub: '4' },
        { main: '√(81) − 2²', sub: '5' },
        { main: '2³ − √4', sub: '6' },
        { main: '√(81) − 2', sub: '7' },
        { main: '2³ + √16 − 4', sub: '8' },
        { main: 'log₃(729) − 3', sub: '9' },
        { main: '√144 − √4', sub: '10' },
        { main: '3² + 2', sub: '11' },
        { main: '√196 − 2', sub: '12' }
      ];

      for (let i = 0; i < 60; i++) {
        const tick = document.createElement('span');
        tick.className = 'tick' + (i % 5 === 0 ? ' major' : '');
        tick.style.transform = `rotate(${i * 6}deg)`;
        dial.appendChild(tick);
      }

      formulaLabels.forEach((entry, index) => {
        const outer = document.createElement('div');
        outer.className = 'label';
        outer.style.transform = `rotate(${index * 30}deg)`;
        outer.innerHTML = `<span>${entry.main}</span><small>${entry.sub}</small>`;
        dial.appendChild(outer);
      });

      const labels = dial.querySelectorAll('.label');
      labels.forEach((label, index) => {
        // Place 12 at the top, 1 at the upper-right, and continue clockwise.
        label.style.transform = `rotate(${(index + 1) * 30}deg)`;
      });

      function updateClock() {
        const now = new Date();
        const hours = now.getHours() % 12;
        const minutes = now.getMinutes();
        const seconds = now.getSeconds() + now.getMilliseconds() / 1000;

        const hourAngle = (hours + minutes / 60 + seconds / 3600) * 30;
        const minuteAngle = (minutes + seconds / 60) * 6;
        const secondAngle = seconds * 6;

        hourHand.style.transform = `translateX(-50%) rotate(${hourAngle}deg)`;
        minuteHand.style.transform = `translateX(-50%) rotate(${minuteAngle}deg)`;
        secondHand.style.transform = `translateX(-50%) rotate(${secondAngle}deg)`;

        timeText.textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
      }

      updateClock();
      setInterval(updateClock, 1000 / 30);
    </script>
  </body>
</html>
